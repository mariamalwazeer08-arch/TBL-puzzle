<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة البازل - بولنق التوأمين</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    color: #fff;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
    text-align: center;
    background: linear-gradient(90deg, #FFD700, #FFA500);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #9aa5c9; font-size: 13px; margin-bottom: 14px; text-align:center; }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  select, button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  select {
    background: #22315c;
    color: #fff;
    border: 1px solid #3a4a7a;
  }
  button {
    background: linear-gradient(90deg,#FFD700,#FFA500);
    color: #1a1a2e;
    transition: transform .15s ease;
  }
  button:active { transform: scale(0.95); }
  button.secondary {
    background: #22315c;
    color: #fff;
    border: 1px solid #3a4a7a;
  }

  .stats {
    display: flex;
    gap: 18px;
    margin-bottom: 12px;
    font-size: 14px;
    color: #cdd6ee;
  }
  .stats b { color: #FFD700; }

  #board {
    display: grid;
    direction: ltr;
    gap: 2px;
    background: #0a0a14;
    border: 3px solid #FFD700;
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    touch-action: manipulation;
    max-width: 94vw;
    position: relative;
    transition: border-color .4s ease, box-shadow .4s ease;
  }
  #board.solved {
    border-color: #00e676;
    animation: glowPulse 1.4s ease-in-out infinite;
  }
  #board.solved::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 230, 118, 0.28);
    animation: flashGreen 1.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 20px 4px rgba(0,230,118,0.7), 0 8px 30px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 45px 14px rgba(0,230,118,1), 0 8px 30px rgba(0,0,0,0.5); }
  }
  @keyframes flashGreen {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.5; }
  }
  .piece {
    background-repeat: no-repeat;
    cursor: pointer;
    position: relative;
    outline: 2px solid transparent;
    transition: outline-color .15s ease, filter .15s ease;
  }
  .piece.selected {
    outline: 3px solid #00e5ff;
    filter: brightness(1.15);
    z-index: 2;
  }
  .piece.correct::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 230, 118, 0.18);
    border: 1px solid rgba(0,230,118,0.5);
  }

  #winMsg {
    display: none;
    margin-top: 16px;
    text-align: center;
    background: rgba(0,230,118,0.12);
    border: 1px solid #00e676;
    border-radius: 12px;
    padding: 14px 20px;
  }
  #winMsg h2 { color: #00e676; font-size: 18px; margin-bottom: 4px; }
  #winMsg p { color: #cdd6ee; font-size: 13px; }

  .qr-panel {
    display: none;
    margin-top: 16px;
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    color: #1a1a2e;
  }
  .qr-panel p { font-size: 12px; margin-top: 8px; color: #333; max-width: 220px; }
  #qrcode { display:flex; justify-content:center; }

  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: #7c88b0;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>

<h1>🎳 بازل صورة البولنق</h1>
<div class="subtitle">اضغط على قطعتين لتبديل أماكنهما وأكمل الصورة</div>

<div class="controls">
  <button id="newGameBtn">🔀 لعبة جديدة</button>
  <button class="secondary" id="qrBtn">📱 QR Code</button>
</div>

<div class="stats">
  <div>الحركات: <b id="moves">0</b></div>
  <div>الوقت: <b id="timer">00:00</b></div>
</div>

<div id="board"></div>

<div id="winMsg">
  <h2>🎉 أحسنت! أكملت البازل</h2>
  <p id="winStats"></p>
</div>

<div class="qr-panel" id="qrPanel">
  <div id="qrcode"></div>
  <p>امسح الكود لفتح نفس صفحة اللعبة (يعمل بعد مشاركة الرابط)</p>
</div>

<div class="hint">💡 نصيحة: اضغط على قطعة ثم قطعة أخرى لتبديل مكانهما. القطع الخضراء في مكانها الصحيح.</div>

let gridSize = 5;
let pieces = [];      // pieces[cell] = original piece index currently at that cell
let selected = null;
let moves = 0;
let timerInterval = null;
let seconds = 0;
let started = false;
let solved = false;

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const winMsg = document.getElementById('winMsg');
const winStats = document.getElementById('winStats');

function formatTime(s) {
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

function startTimer() {
  stopTimer();
  seconds = 0;
  timerEl.textContent = formatTime(seconds);
  timerInterval = setInterval(() => {
    seconds++;
    timerEl.textContent = formatTime(seconds);
  }, 1000);
}
function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  // ensure not already solved and is solvable-ish (any permutation works since we allow free swaps)
  const isSolved = a.every((v, idx) => v === idx);
  if (isSolved) return shuffle(arr);
  return a;
}

function buildBoard() {
  board.innerHTML = '';
  const total = gridSize * gridSize;
  const boardPx = Math.min(window.innerWidth * 0.94, 460);
  const pieceSize = boardPx / gridSize;

  board.style.gridTemplateColumns = `repeat(${gridSize}, ${pieceSize}px)`;
  board.style.gridTemplateRows = `repeat(${gridSize}, ${pieceSize}px)`;

  const order = Array.from({length: total}, (_, i) => i);
  pieces = shuffle(order);
  selected = null;
  moves = 0;
  movesEl.textContent = moves;
  solved = false;
  winMsg.style.display = 'none';
  board.classList.remove('solved');
  started = false;
  stopTimer();
  seconds = 0;
  timerEl.textContent = formatTime(seconds);

  for (let cell = 0; cell < total; cell++) {
    const div = document.createElement('div');
    div.className = 'piece';
    div.dataset.cell = cell;
    div.style.width = pieceSize + 'px';
    div.style.height = pieceSize + 'px';
    div.style.backgroundImage = `url(${IMG_SRC})`;
    div.style.backgroundSize = `${boardPx}px ${boardPx}px`;
    setPieceBg(div, pieces[cell], pieceSize, boardPx);
    div.addEventListener('click', () => onPieceClick(cell));
    board.appendChild(div);
  }
  checkCorrectHighlights();
}

function setPieceBg(div, pieceIndex, pieceSize, boardPx) {
  const col = pieceIndex % gridSize;
  const row = Math.floor(pieceIndex / gridSize);
  div.style.backgroundPosition = `-${col * pieceSize}px -${row * pieceSize}px`;
}

function checkCorrectHighlights() {
  const divs = board.children;
  for (let cell = 0; cell < divs.length; cell++) {
    if (pieces[cell] === cell) {
      divs[cell].classList.add('correct');
    } else {
      divs[cell].classList.remove('correct');
    }
  }
}

function onPieceClick(cell) {
  if (solved) return;
  if (!started) { started = true; startTimer(); }

  const divs = board.children;
  if (selected === null) {
    selected = cell;
    divs[cell].classList.add('selected');
    return;
  }
  if (selected === cell) {
    divs[cell].classList.remove('selected');
    selected = null;
    return;
  }
  // swap
  [pieces[selected], pieces[cell]] = [pieces[cell], pieces[selected]];
  const boardPx = board.getBoundingClientRect().width;
  const pieceSize = boardPx / gridSize;
  setPieceBg(divs[selected], pieces[selected], pieceSize, boardPx);
  setPieceBg(divs[cell], pieces[cell], pieceSize, boardPx);

  divs[selected].classList.remove('selected');
  selected = null;
  moves++;
  movesEl.textContent = moves;

  checkCorrectHighlights();
  checkWin();
}

function checkWin() {
  const isSolved = pieces.every((v, idx) => v === idx);
  if (isSolved) {
    solved = true;
    stopTimer();
    winStats.textContent = `الحركات: ${moves} | الوقت: ${formatTime(seconds)}`;
    winMsg.style.display = 'block';
    board.classList.add('solved');
  }
}

document.getElementById('newGameBtn').addEventListener('click', () => {
  buildBoard();
});

const qrBtn = document.getElementById('qrBtn');
const qrPanel = document.getElementById('qrPanel');
let qrGenerated = false;
qrBtn.addEventListener('click', () => {
  qrPanel.style.display = qrPanel.style.display === 'block' ? 'none' : 'block';
  if (qrPanel.style.display === 'block' && !qrGenerated) {
    try {
      new QRCode(document.getElementById('qrcode'), {
        text: window.location.href,
        width: 180,
        height: 180,
        colorDark: "#1a1a2e",
        colorLight: "#ffffff"
      });
      qrGenerated = true;
    } catch (e) {
      document.getElementById('qrcode').textContent = 'شارك رابط هذه الصفحة لإنشاء QR Code';
    }
  }
});

window.addEventListener('resize', () => {
  // rebuild sizing only (keep state) - simplest: just rebuild layout without reshuffle
  const boardPx = Math.min(window.innerWidth * 0.94, 460);
  const pieceSize = boardPx / gridSize;
  board.style.gridTemplateColumns = `repeat(${gridSize}, ${pieceSize}px)`;
  board.style.gridTemplateRows = `repeat(${gridSize}, ${pieceSize}px)`;
  const divs = board.children;
  for (let cell = 0; cell < divs.length; cell++) {
    divs[cell].style.width = pieceSize + 'px';
    divs[cell].style.height = pieceSize + 'px';
    divs[cell].style.backgroundSize = `${boardPx}px ${boardPx}px`;
    setPieceBg(divs[cell], pieces[cell], pieceSize, boardPx);
  }
});

buildBoard();
</script>
